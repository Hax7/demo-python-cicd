apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/demo-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8000"
          ports:
            - containerPort: 8000